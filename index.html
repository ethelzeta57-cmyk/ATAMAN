<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    function solveSimpleChallenge() { return true; }
    var solveSimpleChallenge = solveSimpleChallenge;
    window.solveSimpleChallenge = solveSimpleChallenge;
    if (typeof globalThis !== 'undefined') globalThis.solveSimpleChallenge = solveSimpleChallenge;
    if (typeof self !== 'undefined') self.solveSimpleChallenge = solveSimpleChallenge;
    window.addEventListener('error', function (e) {
      if (e && e.message && e.message.indexOf('solveSimpleChallenge') !== -1) {
        e.preventDefault();
        return true;
      }
    });
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATAMAN - Tanom. Ataman. Padayon.</title>
  <meta name="description" content="ATAMAN - Tanom. Ataman. Padayon. Plant, nurture, and grow together." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- PWA Manifest & Mobile Capability Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#166534" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ATAMAN" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="assets/icons/icon-512.png" />

  <style>
    /* ─── Reset ─────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #081409;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
    }

    /* ─── App Shell ──────────────────────────────────────────────── */
    #splashView,
    #loginView {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      will-change: opacity, transform;
      border: none;
      outline: none;
      box-shadow: none;
    }

    /* ════════════════════════════════════════════════════════════
       SPLASH SCREEN
    ════════════════════════════════════════════════════════════ */
    #splashView {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      border: none;
      outline: none;
      box-shadow: none;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #26211e 0%, #171412 50%, #0d0c0b 100%);
    }

    #splashView.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #splashView.exiting {
      opacity: 0;
      transform: translateY(-18px);
      pointer-events: none;
    }

    /* Background image - fullpage and perfectly fit */
    .splash-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
      border: none;
      outline: none;
      box-shadow: none;
      pointer-events: none;
      user-select: none;
    }

    /* Clean overlay keeping the natural bright sunlight and lush green colors intact while enhancing center contrast */
    .splash-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.52) 100%);
    }

    /* ── Centered brand container: logo + CTA lockup ── */
    .splash-brand {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Unified vertical lockup: logo on top, button directly underneath */
    .splash-content-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      animation: logoCardFadeIn 0.85s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .splash-logo-card {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    /* Original logo with gradient green icon & dark forest text without white border matching reference image */
    .splash-logo {
      width: clamp(320px, 42vw, 480px);
      max-width: 90vw;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 22px rgba(0, 0, 0, 0.75)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.85));
    }

    @keyframes logoCardFadeIn {
      from {
        opacity: 0;
        transform: translateY(-16px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cta-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: fadeSlideUp 0.85s 0.25s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Exact reference CTA button: Deep forest green pill button with bright lime leaves, white text & arrow */
    .btn-get-started {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: clamp(250px, 28vw, 290px);
      height: 49px;
      padding: 0 24px;
      box-sizing: border-box;
      border: none;
      border-radius: 9999px;
      background: linear-gradient(180deg, #037c36 0%, #02662c 45%, #01461f 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(1, 40, 16, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
      letter-spacing: 0.2px;
      white-space: nowrap;
      text-decoration: none;
      outline: none;
    }

    .btn-get-started:hover {
      background: linear-gradient(180deg, #048d3e 0%, #037533 45%, #025225 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(1, 40, 16, 0.5), 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    .btn-get-started:hover .btn-arrow {
      transform: translateX(4px);
    }

    .btn-get-started:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 4px 14px rgba(1, 40, 16, 0.30);
    }

    .btn-leaf-icon {
      width: 26px;
      height: auto;
      flex-shrink: 0;
      display: block;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
    }

    .btn-arrow {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      color: #ffffff;
      transition: transform 0.25s ease;
    }

    /* ════════════════════════════════════════════════════════════
       RESPONSIVE BREAKPOINTS (ALL DEVICES - ALWAYS CENTERED)
    ════════════════════════════════════════════════════════════ */

    /* ── Tablet Landscape / Medium Desktop (601px – 960px) ───── */
    @media (max-width: 960px) and (min-width: 601px) and (orientation: landscape) {
      .splash-brand {
        max-width: 480px;
        padding: 16px;
      }

      .splash-logo {
        width: clamp(260px, 44vw, 380px);
      }

      .btn-get-started {
        width: clamp(230px, 28vw, 280px);
        height: 48px;
        font-size: 16px;
      }
    }

    /* ── Tablet Portrait (601px – 900px wide, taller than wide) ── */
    @media (max-width: 900px) and (min-width: 601px) and (orientation: portrait) {
      #splashView {
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .splash-bg {
        object-position: center center;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .splash-overlay {
        display: block;
      }

      .splash-brand {
        width: 100%;
        max-width: 460px;
        margin: 0 auto;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
        box-shadow: none;
        padding: 24px;
      }

      .splash-content-lockup {
        width: 100%;
        gap: 16px;
      }

      .splash-logo {
        width: clamp(260px, 50vw, 360px);
      }

      .btn-get-started {
        width: clamp(240px, 40vw, 280px);
        height: 48px;
        font-size: 16px;
      }
    }

    /* ── Mobile (≤ 600px wide) ── */
    @media (max-width: 600px) {
      #splashView {
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .splash-bg {
        object-position: center center;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .splash-overlay {
        display: block;
      }

      .splash-brand {
        width: 100%;
        max-width: 360px;
        margin: 0 auto;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
        box-shadow: none;
        padding: 16px;
      }

      .splash-content-lockup {
        width: 100%;
        gap: 14px;
      }

      .splash-logo {
        width: clamp(230px, 78vw, 320px);
      }

      .btn-get-started {
        width: clamp(220px, 68vw, 270px);
        height: 46px;
        font-size: 15.5px;
      }
    }

    /* ── Small / Compact Phones (≤ 600px wide AND height ≤ 700px) ── */
    @media (max-width: 600px) and (max-height: 700px) {
      .splash-brand {
        padding: 12px;
      }

      .splash-content-lockup {
        gap: 10px;
      }

      .splash-logo {
        width: clamp(190px, 66vw, 240px);
      }

      .btn-get-started {
        height: 42px;
        font-size: 14.5px;
        max-width: 240px;
      }
    }

    /* ── Extra Narrow Phones (≤ 360px wide) ── */
    @media (max-width: 360px) {
      .splash-brand {
        padding: 10px;
      }

      .splash-logo {
        width: clamp(180px, 82vw, 230px);
      }

      .btn-get-started {
        height: 42px;
        font-size: 14px;
        max-width: 230px;
      }
    }

    /* ── Mobile Landscape (height ≤ 520px AND landscape orientation) ── */
    @media (max-height: 520px) and (orientation: landscape) {
      #splashView {
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .splash-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        -webkit-mask-image: none;
        mask-image: none;
      }

      .splash-overlay {
        display: block;
      }

      .splash-brand {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        padding: 10px;
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      .splash-content-lockup {
        gap: 8px;
      }

      .splash-logo {
        width: clamp(160px, 35vh, 220px);
      }

      .btn-get-started {
        width: clamp(190px, 26vw, 240px);
        height: 40px;
        font-size: 14px;
        padding: 0 16px;
        gap: 8px;
      }

      .btn-leaf-icon {
        width: 20px;
      }

      .btn-arrow {
        width: 18px;
        height: 18px;
      }
    }

    /* ════════════════════════════════════════════════════════════
       LOGIN VIEW
    ════════════════════════════════════════════════════════════ */
    #loginView {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.55s ease, transform 0.55s ease;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #loginView.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    :root {
      --lv-green: #11592c;
      --lv-green-hover: #0c4622;
      --lv-green-active: #083317;
      --lv-focus-ring: 0 0 0 3px rgba(17, 89, 44, 0.18);
      --lv-input-radius: 8px;
      --lv-btn-radius: 50px;
      --lv-border: #b8c1c7;
      --lv-border-focus: #11592c;
    }

    /* ── Page wrapper ── */
    .lv-page {
      position: relative;
      min-height: 100%;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-image: linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.16)), url('assets/Plain.jpg');
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
      padding: clamp(20px, 3.5vh, 44px) clamp(16px, 5vw, 40px) clamp(16px, 2.5vh, 24px);
      box-sizing: border-box;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Center content column ── */
    .lv-center {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      padding: 8px 0;
    }

    /* ── Logo ── */
    .lv-logo {
      height: clamp(84px, 15vw, 115px);
      width: auto;
      object-fit: contain;
      display: block;
      margin-bottom: clamp(10px, 2.2vh, 16px);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.08));
    }

    /* ── Heading ── */
    .lv-heading {
      font-size: clamp(22px, 4.5vw, 28px);
      font-weight: 600;
      color: #17542d;
      text-align: center;
      margin-bottom: clamp(20px, 3.5vh, 28px);
      letter-spacing: -0.2px;
    }

    /* ── Form ── */
    .lv-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lv-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lv-label {
      font-size: 13.5px;
      font-weight: 500;
      color: #33393f;
    }

    .lv-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .lv-field-icon {
      position: absolute;
      left: 13px;
      width: 17px;
      height: 17px;
      color: #9aa1a6;
      pointer-events: none;
      flex-shrink: 0;
      transition: color 0.18s;
    }

    .lv-field:focus-within .lv-field-icon {
      color: var(--lv-green);
    }

    .lv-input {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 42px;
      font-family: inherit;
      font-size: 14.5px;
      color: #1a1e21;
      background: #ffffff;
      border: 1px solid var(--lv-border);
      border-radius: var(--lv-input-radius);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .lv-input::placeholder {
      color: #9aa1a6;
      font-weight: 400;
    }

    .lv-input:focus {
      border-color: var(--lv-border-focus);
      box-shadow: var(--lv-focus-ring);
    }

    /* Eye toggle */
    .lv-eye-btn {
      position: absolute;
      right: 11px;
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      color: #9aa1a6;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      outline: none;
      transition: color 0.18s, background 0.18s;
    }

    .lv-eye-btn:hover {
      color: #4b5563;
      background: #f3f4f6;
    }

    .lv-eye-icon {
      width: 19px;
      height: 19px;
    }

    /* ── Remember + Forgot row ── */
    .lv-form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .lv-remember {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .lv-remember input[type=checkbox] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .lv-cb-box {
      width: 16px;
      height: 16px;
      border: 1.5px solid #9aa1a6;
      border-radius: 4px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    .lv-cb-box svg {
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .lv-remember input[type=checkbox]:checked+.lv-cb-box {
      background: var(--lv-green);
      border-color: var(--lv-green);
    }

    .lv-remember input[type=checkbox]:checked+.lv-cb-box svg {
      opacity: 1;
      transform: scale(1);
    }

    .lv-cb-text {
      font-size: 13.5px;
      font-weight: 400;
      color: #2b3034;
    }

    .lv-forgot {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--lv-green);
      text-decoration: underline;
      text-underline-offset: 2.5px;
      transition: color 0.18s;
    }

    .lv-forgot:hover {
      color: var(--lv-green-hover);
    }

    /* ── Sign In button ── */
    .lv-submit {
      width: 100%;
      height: 48px;
      background: var(--lv-green);
      color: #fff;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 600;
      border: none;
      border-radius: var(--lv-btn-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      box-shadow: 0 4px 14px rgba(17, 89, 44, 0.30);
      transition: background 0.2s, transform 0.18s, box-shadow 0.18s;
      outline: none;
      letter-spacing: 0.1px;
    }

    .lv-submit:hover {
      background: var(--lv-green-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(17, 89, 44, 0.38);
    }

    .lv-submit:active {
      transform: translateY(0);
      background: var(--lv-green-active);
    }

    /* ── OR divider ── */
    .lv-or {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 18px 0 12px;
      gap: 12px;
    }

    .lv-or::before,
    .lv-or::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(0, 0, 0, 0.12);
    }

    .lv-or-text {
      font-size: 13.5px;
      color: #787f85;
      font-style: italic;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Register prompt ── */
    .lv-register {
      text-align: center;
      margin-top: 6px;
    }

    .lv-register-text {
      font-size: 14px;
      font-weight: 500;
      color: #33393f;
      margin-bottom: 5px;
    }

    .lv-register-link {
      display: inline-block;
      font-size: 14px;
      font-weight: 500;
      color: var(--lv-green);
      text-decoration: underline;
      text-underline-offset: 2.5px;
      transition: color 0.18s;
    }

    .lv-register-link:hover {
      color: var(--lv-green-hover);
    }

    /* ── Footer ── */
    .lv-footer {
      width: 100%;
      text-align: center;
      padding: 16px 0 20px;
      font-size: 12px;
      color: #7b8389;
      font-weight: 400;
      border-top: none;
      margin-top: auto;
    }

    /* Spinner */
    .lv-spinner {
      width: 17px;
      height: 17px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .lv-toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #0f172a;
      color: #fff;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lv-toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .lv-toast-icon {
      font-size: 17px;
    }

    .lv-toast-msg {
      font-size: 13.5px;
      font-weight: 500;
    }

    .hide {
      display: none !important;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .lv-page {
        padding-top: clamp(24px, 5vh, 40px);
      }

      .lv-logo {
        height: clamp(72px, 22vw, 100px);
      }

      .lv-input {
        height: 48px;
        font-size: 14.5px;
      }

      .lv-submit {
        height: 50px;
        font-size: 15px;
      }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      .lv-page {
        padding-top: 16px;
        justify-content: flex-start;
        overflow-y: auto;
      }

      .lv-logo {
        height: 64px;
      }

      .lv-heading {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH VIEW -->
  <div id="splashView">
    <img src="assets/tree1.jpg" alt="Hands holding a tree in lush green nature" class="splash-bg" />
    <div class="splash-overlay"></div>

    <!-- Right-side brand: logo with CTA directly underneath -->
    <div class="splash-brand">
      <div class="splash-content-lockup">
        <div class="splash-logo-card">
          <img src="assets/ataman-logo-stacked.png" alt="ATAMAN - Tanom. Ataman. Padayon." class="splash-logo" />
        </div>

        <div class="cta-section">
          <button class="btn-get-started" id="getStartedBtn" aria-label="Get Started with ATAMAN">
            <img src="assets/btn-leaf-icon.png" srcset="assets/btn-leaf-icon.png 1x, assets/btn-leaf-icon@2x.png 2x"
              class="btn-leaf-icon" alt="" />
            <span>Get Started</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="20" y2="12"></line>
              <polyline points="13 5 20 12 13 19"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>


  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="lv-page">

      <!-- Center content -->
      <div class="lv-center">

        <!-- Logo -->
        <img src="assets/ataman-logo-stacked.png" alt="ATAMAN - Tanom. Ataman. Padayon." class="lv-logo" />

        <!-- Heading -->
        <h1 class="lv-heading">Welcome to ATAMAN</h1>

        <!-- Auth form -->
        <form class="lv-form" id="authForm" novalidate>

          <!-- Email -->
          <div class="lv-group">
            <label for="emailInput" class="lv-label">Email Address</label>
            <div class="lv-field">
              <svg class="lv-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input type="email" id="emailInput" name="email" class="lv-input" placeholder="your.email@example.com"
                required autocomplete="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="lv-group">
            <label for="passwordInput" class="lv-label">Password</label>
            <div class="lv-field">
              <svg class="lv-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input type="password" id="passwordInput" name="password" class="lv-input" placeholder="••••••••" required
                autocomplete="current-password" />
              <button type="button" class="lv-eye-btn" id="passwordToggle" aria-label="Toggle password visibility"
                tabindex="-1">
                <svg class="lv-eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="lv-eye-icon eye-slash hide" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                  <line x1="2" x2="22" y1="2" y2="22" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember me + Forgot -->
          <div class="lv-form-row" id="signInActions">
            <label class="lv-remember" for="rememberMe">
              <input type="checkbox" id="rememberMe" name="remember" />
              <span class="lv-cb-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"
                  stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </span>
              <span class="lv-cb-text">Remember Me</span>
            </label>
            <a href="#" class="lv-forgot" id="forgotPasswordBtn">Forgot Password?</a>
          </div>

          <!-- Sign In button -->
          <button type="submit" class="lv-submit" id="submitBtn">
            <span class="lv-spinner hide" id="btnSpinner"></span>
            <span id="btnText">Sign In</span>
          </button>

        </form>

        <!-- OR divider -->
        <div class="lv-or">
          <span class="lv-or-text">Or</span>
        </div>

        <!-- Register prompt -->
        <div class="lv-register">
          <p class="lv-register-text">New to ATAMAN?</p>
          <div
            style="display:flex;gap:10px;justify-content:center;align-items:center;margin-top:6px;font-size:0.92rem;">
            <a href="register-adopter.html" class="lv-register-link">Register as Adopter</a>
            <span style="opacity:0.4;">|</span>
            <a href="register-caretaker.html" class="lv-register-link">Register as Caretaker</a>
          </div>
        </div>

      </div><!-- /.lv-center -->

      <!-- Footer -->
      <footer class="lv-footer">
        &copy; 2026 ATAMAN(CICTO). All Rights Reserved.
      </footer>

    </div><!-- /.lv-page -->

    <div class="lv-toast" id="toast">
      <span class="lv-toast-icon" id="toastIcon">&#127807;</span>
      <span class="lv-toast-msg" id="toastMessage">Welcome to ATAMAN!</span>
    </div>
  </div>

  <!-- Firebase challenge shim -->
  <script>
    function solveSimpleChallenge() { return true; }
    window.solveSimpleChallenge = solveSimpleChallenge;
    if (typeof globalThis !== 'undefined') globalThis.solveSimpleChallenge = solveSimpleChallenge;
    if (typeof self !== 'undefined') self.solveSimpleChallenge = solveSimpleChallenge;
    window.addEventListener('error', function (e) {
      if (e && e.message && e.message.indexOf('solveSimpleChallenge') !== -1) { e.preventDefault(); return true; }
    });
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    /* ── Splash → Login transition ── */
    const splashView = document.getElementById('splashView');
    const loginView = document.getElementById('loginView');

    function goToLogin(immediate = false) {
      if (window.ATAMAN_NETWORK && !window.ATAMAN_NETWORK.isOnline()) {
        window.ATAMAN_NETWORK.showOfflineBlocker();
        return;
      }

      if (immediate) {
        splashView.style.display = 'none';
        loginView.classList.add('visible');
        const first = loginView.querySelector('input:not([type=checkbox])');
        if (first) setTimeout(() => first.focus(), 80);
        return;
      }
      if (splashView.classList.contains('exiting')) return;
      splashView.classList.add('exiting');
      let transitioned = false;
      function showLogin() {
        if (transitioned) return;
        transitioned = true;
        splashView.style.display = 'none';
        loginView.classList.add('visible');
        const first = loginView.querySelector('input:not([type=checkbox])');
        if (first) setTimeout(() => first.focus(), 80);
      }
      splashView.addEventListener('transitionend', function handler(e) {
        if (e.target !== splashView) return;
        splashView.removeEventListener('transitionend', handler);
        showLogin();
      });
      setTimeout(showLogin, 600);
    }

    const getStartedBtn = document.getElementById('getStartedBtn');
    if (getStartedBtn) {
      getStartedBtn.addEventListener('click', (e) => {
        e.preventDefault();
        goToLogin(false);
      });
      getStartedBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        goToLogin(false);
      }, { passive: false });
    }

    const loginLink = document.getElementById('loginLinkBtn');
    if (loginLink) {
      loginLink.addEventListener('click', function (e) {
        e.preventDefault();
        goToLogin(false);
      });
    }

    /* Randomise leaf position on each loop */
    document.querySelectorAll('.leaf-particle').forEach(leaf => {
      leaf.addEventListener('animationiteration', () => {
        leaf.style.left = (Math.random() * 80 + 5) + '%';
      });
    });

    /* Fade-in splash on load or jump to login if #login (resilient to mobile bfcache / readyState) */
    function initView() {
      if (window.location.hash === '#login' || window.location.search.includes('login')) {
        goToLogin(true);
      } else {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          splashView.classList.add('visible');
        }));
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', initView);
    } else {
      initView();
    }

    // Safety fallback: ensure splash is never permanently invisible on mobile
    setTimeout(() => {
      if (!splashView.classList.contains('visible') && !loginView.classList.contains('visible') && splashView.style.display !== 'none') {
        splashView.classList.add('visible');
      }
    }, 400);
  </script>

  <!-- ATAMAN Internet Connectivity & Mobile Browser Engine -->
  <script src="ataman-connectivity.js"></script>
  <!-- app.js handles actual Firebase sign-in / sign-up / Google auth -->
  <script src="app.js"></script>
  <!-- PWA Service Worker Registration -->
  <script src="pwa-register.js" defer></script>
</body>

</html>
